# Hot standby for the Vite dev proxy (see /etc/apache2/vite-dev-proxy.inc).
# Serves static files only, on loopback: no .htaccess, no PHP, so a Vite path
# such as /@vite/client gets a plain 404 instead of reaching router.php.

Listen 127.0.0.1:8173

<VirtualHost 127.0.0.1:8173>
    ServerName vite-fallback.localhost
    DocumentRoot /var/www/matecat

    <Directory /var/www/matecat>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        php_admin_flag engine off
    </Directory>

    <FilesMatch "\.(php|phtml|ini)$">
        Require all denied
    </FilesMatch>
</VirtualHost>
